# DB 깨우기
# - 사흘마다 가벼운 조회(lw_ping)로 Supabase 무료 프로젝트가 멈추지 않게 한다.
# - 매월 1일에는 .github/keepalive.txt에 시각을 적어 커밋한다. 저장소에 60일 동안 변화가 없으면
#   GitHub가 예약 작업을 꺼 버리기 때문이다.
# - Actions 탭에서 수동으로도 돌릴 수 있다(기록 커밋을 함께 남길지 고른다).
# 접속 정보는 assets/config.js(브라우저에 공개되는 주소와 publishable key)에서 읽는다. 비밀 값은 쓰지 않는다.
name: keepalive

on:
  schedule:
    - cron: '17 3 */3 * *'   # 사흘마다 03:17 UTC (한국 12:17)
    - cron: '41 4 1 * *'     # 매월 1일 04:41 UTC: 깨우기 + 기록 커밋
  workflow_dispatch:
    inputs:
      record:
        description: '기록 커밋도 남길까요?'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DB 깨우기 (lw_ping)
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' assets/config.js | head -1)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' assets/config.js | head -1)
          test -n "$URL" && test -n "$KEY"
          code=$(curl -s -o out.json -w '%{http_code}' -X POST "$URL/rest/v1/rpc/lw_ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; cat out.json; echo
          test "$code" = "200"

  record:
    needs: ping
    if: github.event.schedule == '41 4 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.record)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 기록 커밋
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "깨우기 기록 $(date -u +%Y-%m-%d)" || { echo "바뀐 것 없음"; exit 0; }
          git push
